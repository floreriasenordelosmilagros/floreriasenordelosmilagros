    <title>Galería de Alfombras Florales</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .gallery-container {
            padding: 60px 10%;
            text-align: center;
        }
        .gallery-container h1 {
            color: #2e1a47;
            font-size: 36px;
            margin-bottom: 15px;
        }
        .gallery-container .subtitle {
            color: #666;
            margin-bottom: 40px;
            font-size: 18px;
        }
        /* Cuadrícula adaptable para fotos de alfombras */
        .grid-fotos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin-bottom: 50px;
        }
        .foto-card {
            background: #ffffff;
            padding: 12px;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(74, 20, 140, 0.06);
            border: 1px solid #f3e5f5;
            transition: transform 0.3s;
        }
        .foto-card:hover {
            transform: scale(1.03);
        }
        .foto-card img {
            width: 100%;
            height: 320px;
            object-fit: cover;
            border-radius: 8px;
            display: block;
        }
        .btn-back {
            display: inline-block;
            background-color: #6a1b9a;
            color: #ffffff;
            padding: 12px 35px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 25px;
            transition: background 0.3s;
        }
        .btn-back:hover {
            background-color: #2e1a47;
        }
    </style>
</head>
