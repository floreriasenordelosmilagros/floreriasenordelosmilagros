        .grid-fotos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin-bottom: 50px;
        }
        .foto-card {
            background: #ffffff;
            padding: 12px;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(74, 20, 140, 0.06);
            border: 1px solid #f3e5f5;
            transition: transform 0.3s;
        }
        .foto-card:hover {
            transform: scale(1.03);
        }
        .foto-card img {
            width: 100%;
            height: 320px;
            object-fit: cover;
            border-radius: 8px;
            display: block;
        }
        .btn-back {
            display: inline-block;
            background-color: #6a1b9a;
            color: #ffffff;
            padding: 12px 35px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 25px;
            transition: background 0.3s;
        }
        .btn-back:hover {
